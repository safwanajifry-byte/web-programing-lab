<!DOCTYPE html>
<html>
<head>
    <title>String Methods and Math Object</title>
</head>
<body>

<center>

<h2><u>STRING METHOD</u></h2>

<p><b>JavaScript String Methods</b></p>

<script>
    var name = "i am safwana";

    document.write(name);
    document.write("<br/>");

    document.write("Length of string is: ");
    document.write(name.length);
    document.write("<br/>");

    document.write("Index of first occurrence of a is: ");
    document.write(name.indexOf("a"));
    document.write("<br/>");

    document.write("Index of last occurrence of a is: ");
    document.write(name.lastIndexOf("a"));
    document.write("<br/>");

    document.write("Index of am in string: ");
    document.write(name.search("am"));
    document.write("<br/>");

    document.write("Print index 0 to 3 using slice: ");
    document.write(name.slice(0, 4));
    document.write("<br/>");

    document.write("Substring using substring: ");
    document.write(name.substring(0, 8));
    document.write("<br/>");

    document.write("Substring using substr: ");
    document.write(name.substr(0, 3));
    document.write("<br/>");

    document.write("String to uppercase: ");
    document.write(name.toUpperCase());
    document.write("<br/>");

    document.write("Replace safwana with saf: ");
    document.write(name.replace("safwana", "saf"));
    document.write("<br/>");

    document.write("Use trim: ");
    document.write(name.trim());
    document.write("<br/>");

    document.write("Character at index 5: ");
    document.write(name.charAt(5));
    document.write("<br/>");

    document.write("ASCII value of character at index 5: ");
    document.write(name.charCodeAt(5));
    document.write("<br/>");
</script>

<h2><u>MATH OBJECT</u></h2>

<p>
    <b>
        Math object is a built-in object that contains basic mathematical
        functions and constants.
    </b>
</p>

<script type="text/javascript">

    document.write("Value of PI in radians: ");
    document.write(Math.PI);
    document.write("<br/>");

    document.write("PI in degrees: ");
    document.write(Math.PI * 180 / Math.PI);
    document.write("<br/>");

    document.write("Value of E: ");
    document.write(Math.E);
    document.write("<br/>");

</script>

</center>

</body>
</html>
